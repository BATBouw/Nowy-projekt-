<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAT Bouw | Uw Professionele Aannemer</title>
    <style>
        :root {
            --primary: #1e293b; /* Ekskluzywny grafit (Slate 800) */
            --accent: #f59e0b;  /* Budowlany złoty pomarańcz */
            --text-dark: #334155;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --success: #16a34a; /* Profesjonalna zieleń dla przycisków kontaktu */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            scroll-behavior: smooth;
        }

        body {
            color: var(--text-dark);
            background-color: var(--white);
            line-height: 1.6;
        }

        /* Menu / Nawigacja */
        header {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 20px rgba(0, 0, 0, 0.05);
            position: fixed;
            width: 100%;
            top: 0;
            z-index: 1000;
            border-bottom: 1px solid #e2e8f0;
        }

        .nav-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .logo span {
            color: var(--accent);
        }

        nav a {
            text-decoration: none;
            color: var(--primary);
            margin-left: 1.5rem;
            font-weight: 600;
            transition: color 0.2s;
        }

        nav a:hover {
            color: var(--accent);
        }

        .btn-nav {
            background-color: var(--primary);
            color: var(--white) !important;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
        }

        /* Banner Główny (Hero) */
        .hero {
            background: linear-gradient(rgba(30, 41, 59, 0.85), rgba(30, 41, 59, 0.7)), 
                        url('https://unsplash.com') no-repeat center center/cover;
            height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--white);
            padding: 0 2rem;
            margin-top: 70px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3.2rem;
            margin-bottom: 1rem;
            font-weight: 800;
            line-height: 1.2;
        }

        .hero p {
            font-size: 1.3rem;
            margin-bottom: 2.5rem;
            opacity: 0.95;
        }

        .cta-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn-main {
            display: inline-block;
            background-color: var(--accent);
            color: var(--primary);
            text-decoration: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
            transition: transform 0.2s;
            box-shadow: 0 4px 15px rgba(245, 158, 11, 0.3);
        }

        .btn-main:hover {
            transform: translateY(-2px);
        }

        .btn-secondary {
            display: inline-block;
            background-color: transparent;
            color: var(--white);
            text-decoration: none;
            padding: 1rem 2.5rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
            border: 2px solid var(--white);
            transition: background 0.2s;
        }

        .btn-secondary:hover {
            background-color: var(--white);
            color: var(--primary);
        }

        /* O Firmie / Opis Główny */
        .about {
            padding: 6rem 2rem;
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .about h5 {
            color: var(--accent);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.9rem;
            margin-bottom: 0.5rem;
        }

        .about h2 {
            font-size: 2.5rem;
            color: var(--primary);
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        .about p {
            font-size: 1.15rem;
            color: var(--text-dark);
            max-width: 850px;
            margin: 0 auto;
        }

        /* Sekcja: 6 Powodów */
        .reasons-section {
            background-color: var(--bg-light);
            padding: 6rem 2rem;
        }

        .reasons-grid {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2.5rem;
        }

        .reason-card {
            background: var(--white);
            padding: 2.5rem 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
            border-left: 4px solid var(--accent);
        }

        .reason-card h4 {
            font-size: 1.25rem;
            color: var(--primary);
            margin-bottom: 0.75rem;
            font-weight: 700;
        }

        .reason-card p {
            color: #64748b;
            font-size: 1rem;
        }

        /* Sekcja Kontakt i Formularz (Split Layout) */
        .contact-section {
            padding: 6rem 2rem 4rem;
        }

        .contact-container {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 4rem;
        }

        .contact-info h2 {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            color: var(--primary);
            font-weight: 800;
        }

        .info-block {
            margin-bottom: 2rem;
        }

        .info-block h6 {
            font-size: 0.85rem;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 0.5rem;
        }

        .info-block p, .info-block a {
            font-size: 1.25rem;
            color: var(--primary);
            font-weight: 700;
            text-decoration: none;
        }

        .info-block a.phone-button {
            background-color: var(--success);
            color: var(--white);
            display: inline-flex;
            align-items: center;
            padding: 0.8rem 1.8rem;
            border-radius: 6px;
            font-size: 1.1rem;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.15);
            transition: background 0.2s;
        }

        .info-block a.phone-button:hover {
            background-color: #15803d;
        }

        /* Formularz */
        .contact-form {
            background-color: var(--bg-light);
            padding: 3rem;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }

        .contact-form h3 {
            font-size: 1.5rem;
            margin-bottom: 1.5rem;
            color: var(--primary);
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.9rem;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 1rem;
            background-color: var(--white);
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: var(--accent);
        }

        .btn-submit {
            background-color: var(--primary);
            color: var(--white);
            border: none;
            padding: 1rem 2rem;
            font-size: 1.1rem;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #0f172a;
        }

        /* Sekcja z Mapą Google */
        .map-section {
            width: 100%;
            height: 400px;
            background-color: #cbd5e1;
            position: relative;
        }

        .map-section iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* Stopka */
        footer {
            background-color: var(--primary);
            color: var(--white);
            padding: 4rem 2rem 2rem;
        }

        .footer-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 2rem;
            border-bottom: 1px solid #334155;
            padding-bottom: 2rem;
        }

        .footer-legal p {
            font-size: 0.95rem;
            color: #94a3b8;
            margin-bottom: 0.4rem;
        }

        .copyright {
            text-align: center;
            padding-top: 2rem;
            font-size: 0.9rem;
            color: #64748b;
        }

        /* RWD na telefony */
        @media (max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .hero p { font-size: 1.1rem; }
            nav a:not(.btn-nav) { display: none; }
            .contact-form { padding: 1.5rem; }
            .map-section { height: 300px; }
        }
    </style>
</head>
<body>

    <header>
